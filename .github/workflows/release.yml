name: Windows installer and GitHub release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release tag (for example v0.1.0-alpha.1)
        required: true
        type: string
        default: v0.1.0-alpha.1

permissions: {}

jobs:
  build_release:
    name: Build Windows installer
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      build-type: Release

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          pattern: MatronixLauncher-Windows-MSVC-Setup-*
          merge-multiple: true

      - name: Create public preview release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ inputs.version }}
          target_commitish: ${{ github.sha }}
          name: MatronixLauncher ${{ inputs.version }}
          body: |
            Preview build of MatronixLauncher.

            - Managed mod discovery and downloads use Modrinth only.
            - The installer is unsigned and may trigger a Windows SmartScreen warning.
            - Ely.by login requires the project's own OAuth Client ID and is not enabled in this preview build.
          draft: false
          prerelease: true
          files: MatronixLauncher-Setup.exe
