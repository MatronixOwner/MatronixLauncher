name: Windows installer and GitHub release

on:
  push:
    tags:
      - "*"

permissions: {}

jobs:
  build_release:
    name: Build Windows installer
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      build-type: Release

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          pattern: MatronixLauncher-Windows-MSVC-Setup-*
          merge-multiple: true

      - name: Name installer
        shell: bash
        run: |
          mv MatronixLauncher-Setup.exe "MatronixLauncher-Setup-${GITHUB_REF_NAME}.exe"

      - name: Create draft GitHub release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ github.ref_name }}
          name: MatronixLauncher ${{ github.ref_name }}
          draft: true
          prerelease: false
          files: MatronixLauncher-Setup-${{ github.ref_name }}.exe
