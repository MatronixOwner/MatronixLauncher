name: Inspect Windows multimedia package
on:
  push:
    paths:
      - .github/workflows/video-diagnostics.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MatronixPrismLauncher-Windows-MSVC-Portable-ee5f1ad-Release
          run-id: 43576476331
          github-token: ${{ github.token }}
          path: package
      - name: Check multimedia files
        run: |
          find package -type f | grep -iE 'multimedia|ffmpeg|avcodec|avformat|avutil|swscale|swresample' | while IFS= read -r file; do echo "::notice::$file"; done
          if ! find package -iname '*ffmpeg*' -o -iname '*windowsmedia*' | grep -q .; then echo '::error::No Qt multimedia backend found'; exit 1; fi
