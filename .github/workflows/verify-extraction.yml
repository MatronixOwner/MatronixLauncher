name: Check installer extraction
on:
  push:
    paths: [.github/workflows/verify-extraction.yml]
permissions:
  actions: read
  contents: read
jobs:
  inspect:
    runs-on: windows-2022
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: MatronixPrismLauncher-Windows-MSVC-Setup-379ada7-Release
          run-id: 43603258224
          github-token: ${{ github.token }}
      - shell: pwsh
        run: |
          & 7z x MatronixPrismLauncher-Setup.exe -oextract -y | Out-Null
          if ($LASTEXITCODE -ne 0) { throw "Extraction failed: $LASTEXITCODE" }
          $q = Get-ChildItem extract -Filter Qt6Multimedia.dll -Recurse | Select-Object -First 1
          if (-not $q) { throw 'Qt6Multimedia.dll not found' }
          Write-Output "::notice::Qt6Multimedia location: $($q.FullName)"
          if (Test-Path (Join-Path $q.DirectoryName 'multimedia/ffmpegmediaplugin.dll')) { throw 'Expected old installer to lack plugin' }
          Write-Output '::notice::Confirmed old installer is missing the multimedia plugin.'
