name: Matronix website admin

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: Published release tag used for download buttons
        required: true
        type: string
        default: v0.1.0-alpha.12
      announcement_enabled:
        description: Show the announcement banner
        required: true
        type: boolean
        default: false
      announcement:
        description: Short announcement shown on the homepage (maximum 240 characters)
        required: false
        type: string
        default: ""

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  update-and-deploy:
    if: github.actor == 'MatronixOwner'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout selected site branch
        uses: actions/checkout@v6

      - name: Verify release and installer asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ inputs.release_version }}
        run: |
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'MatronixPrismLauncher-Setup.exe'

      - name: Validate settings and update the site config
        env:
          RELEASE_VERSION: ${{ inputs.release_version }}
          ANNOUNCEMENT_ENABLED: ${{ inputs.announcement_enabled }}
          ANNOUNCEMENT: ${{ inputs.announcement }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          version = os.environ["RELEASE_VERSION"].strip()
          if not re.fullmatch(r"v\d+(?:\.\d+){1,3}(?:-[A-Za-z0-9.-]+)?", version):
              raise SystemExit("Release version must be a valid tag, for example v0.1.0-alpha.12")

          announcement = os.environ.get("ANNOUNCEMENT", "").strip()
          if len(announcement) > 240:
              raise SystemExit("Announcement is limited to 240 characters")

          config_path = Path("website/site-config.json")
          config = json.loads(config_path.read_text(encoding="utf-8"))
          config["releaseVersion"] = version
          config["announcementEnabled"] = os.environ.get("ANNOUNCEMENT_ENABLED", "false").lower() == "true"
          config["announcement"] = announcement
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          PY

      - name: Save site settings to the selected branch
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/site-config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(website): update release and announcement"
            git push origin "HEAD:${GH_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
