name: Windows Release (EXE Installer)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 via micromamba (conda-forge prebuilt)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $tmp = "$env:RUNNER_TEMP"
          # Скачиваем micromamba
          Invoke-WebRequest -Uri "https://micro.mamba.pm/api/micromamba/windows-64/latest" -OutFile "$tmp\micromamba.exe"
          # Создаём окружение с Qt 6 из conda-forge (готовые бинарники, без компиляции)
          & "$tmp\micromamba.exe" create -y -p "$tmp\qt-env" -c conda-forge qt-base=6.7 qt-tools=6.7
          # Пути к Qt
          echo "$tmp\qt-env\Library\bin" >> $env:GITHUB_PATH
          echo "Qt6_DIR=$tmp\qt-env\Library" >> $env:GITHUB_ENV
          echo "CMAKE_PREFIX_PATH=$tmp\qt-env\Library" >> $env:GITHUB_ENV
          Write-Host "Qt6_DIR=$tmp\qt-env\Library"

      - name: Install CMake and NSIS
        run: |
          choco install cmake --version 3.27.0 -y
          choco install nsis -y

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Create NSIS installer
        shell: pwsh
        run: |
          makensis installer.nsi

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/MatronixLauncher.exe
            MatronixLauncher-Setup.exe
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
