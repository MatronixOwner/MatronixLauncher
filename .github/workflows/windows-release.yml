name: Windows installer and GitHub release

on:
  push:
    branches:
      - arena/a2faeba1-matronixlauncher
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: Publish a GitHub release after building
        type: boolean
        required: true
        default: false
      release_tag:
        description: Release tag, for example v0.1.1
        type: string
        required: false
        default: v0.1.1

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installer
        shell: pwsh
        run: |
          npm run dist:win:installer *>&1 | Tee-Object -FilePath build-output.txt
          if ($LASTEXITCODE -ne 0) {
            $detail = (Get-Content build-output.txt | Select-Object -Last 35) -join ' | '
            $detail = $detail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Windows installer build failed::$detail"
            exit $LASTEXITCODE
          }

      - name: Upload installer for this build
        uses: actions/upload-artifact@v4
        with:
          name: ElyPrism-Installer-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") { $tag = $env:GITHUB_REF_NAME }
          else { $tag = $env:RELEASE_TAG }
          if (-not $tag) { throw "Choose a release tag, such as v0.1.1." }
          $files = @(Get-ChildItem release -Filter *.exe | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "No Windows installer .exe was produced." }
          $notes = @"
          ElyPrism Launcher for Windows.

          Includes the NSIS installer. The launcher interface and mod catalogs are available; Minecraft installation, authentication, and launching are still under development.
          "@
          $ghArgs = @("release", "create", $tag) + $files + @(
            "--repo", $env:GITHUB_REPOSITORY,
            "--title", "ElyPrism Launcher $tag",
            "--notes", $notes,
            "--target", $env:GITHUB_SHA
          )
          gh @ghArgs
