name: MatronixLauncher Windows build and release

on:
  push:
    branches:
      - arena/a2faeba1-matronixlauncher
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      create_release:
        description: Опубликовать релиз после сборки
        type: boolean
        required: true
        default: false
      release_tag:
        description: Тег релиза, например v0.1.2
        type: string
        required: false
        default: v0.1.4

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: windows-latest
    steps:
      - name: Получить исходный код
        uses: actions/checkout@v4

      - name: Настроить Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Установить зависимости
        run: npm ci

      - name: Собрать Windows-установщик
        shell: pwsh
        run: |
          npm run dist:win:installer *>&1 | Tee-Object -FilePath build-output.txt
          if ($LASTEXITCODE -ne 0) {
            $detail = (Get-Content build-output.txt | Select-Object -Last 35) -join ' | '
            $detail = $detail -replace '%', '%25' -replace "`r", '%0D' -replace "`n", '%0A'
            Write-Output "::error title=Сборка установщика не удалась::$detail"
            exit $LASTEXITCODE
          }

      - name: Сохранить EXE как артефакт сборки
        uses: actions/upload-artifact@v4
        with:
          name: MatronixLauncher-Setup-${{ github.sha }}
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30

      - name: Опубликовать GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && inputs.create_release) || (github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release v'))
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        shell: pwsh
        run: |
          if ($env:GITHUB_REF -like "refs/tags/*") { $tag = $env:GITHUB_REF_NAME }
          elseif ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") { $tag = $env:RELEASE_TAG }
          else {
            $version = node -p "require('./package.json').version"
            $tag = "v$version"
          }
          if (-not $tag) { throw "Укажи тег релиза, например v0.1.2." }
          $files = @(Get-ChildItem release -Filter *.exe | ForEach-Object { $_.FullName })
          if ($files.Count -eq 0) { throw "Не найден Windows EXE-установщик." }
          $notes = @"
          MatronixLauncher для Windows.

          Минималистичный чёрный анимированный интерфейс с аккуратными неоновыми акцентами, локальный помощник по функциям лаунчера и запрет выделения обычного текста. Установщик позволяет выбрать язык и папку установки.

          Помощник работает на встроенных подсказках без облачной нейросети. Игровой движок, Microsoft-вход и скачивание/установка Minecraft и модов пока находятся в разработке.
          "@
          $ghArgs = @("release", "create", $tag) + $files + @(
            "--repo", $env:GITHUB_REPOSITORY,
            "--title", "MatronixLauncher $tag",
            "--notes", $notes,
            "--target", $env:GITHUB_SHA
          )
          gh @ghArgs
