name: Windows Release (EXE Installer)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python (required by Qt installer)
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Qt 6
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.7'
          target: 'desktop'
          arch: 'win64'

      - name: Install CMake and NSIS
        run: |
          choco install cmake --version 3.27.0 -y
          choco install nsis -y

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$env:Qt6_DIR

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Create NSIS installer
        shell: pwsh
        run: |
          makensis installer.nsi

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/MatronixLauncher.exe
            MatronixLauncher-Setup.exe
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
