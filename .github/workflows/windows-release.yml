name: Windows Release (EXE Installer)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 (direct download)
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          $urls = @(
            "https://download.qt.io/official_releases/qt/6.7/6.7.2/single/qt-6.7.2-x64-msvc2019-windows.zip",
            "https://download.qt.io/official_releases/qt/6.5/6.5.3/single/qt-6.5.3-x64-msvc2019-64-windows.zip",
            "https://download.qt.io/official_releases/qt/6.5/6.5.3/single/qt-6.5.3-x64-msvc2019-windows.zip"
          )
          $success = $false
          foreach ($url in $urls) {
            try {
              Write-Host "Trying: $url"
              Invoke-WebRequest -Uri $url -OutFile "C:\qt.zip" -TimeoutSec 600
              $success = $true
              break
            } catch {
              Write-Host "Failed: $url - $_"
            }
          }
          if (-not $success) {
            Write-Error "All Qt download URLs failed"
            exit 1
          }
          Write-Host "Extracting Qt..."
          Expand-Archive -Path "C:\qt.zip" -DestinationPath "C:\Qt"
          $qtDir = Get-ChildItem -Path "C:\Qt" -Filter "qt-*" | Select-Object -First 1
          if (-not $qtDir) {
            Write-Error "Qt directory not found after extraction"
            exit 1
          }
          Write-Host "Qt installed at $($qtDir.FullName)"
          echo "Qt6_DIR=$($qtDir.FullName)" >> $env:GITHUB_ENV
          echo "QTDIR=$($qtDir.FullName)" >> $env:GITHUB_ENV

      - name: Install CMake and NSIS
        run: |
          choco install cmake --version 3.27.0 -y
          choco install nsis -y

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH=$env:Qt6_DIR

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Create NSIS installer
        shell: pwsh
        run: |
          makensis installer.nsi

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/MatronixLauncher.exe
            MatronixLauncher-Setup.exe
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
