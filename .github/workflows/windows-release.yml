name: Windows Release (EXE Installer)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 via vcpkg
        shell: pwsh
        run: |
          if (-not (Test-Path "C:\vcpkg\vcpkg.exe")) {
            Write-Host "Cloning vcpkg..."
            git clone https://github.com/microsoft/vcpkg.git C:\vcpkg
            C:\vcpkg\bootstrap-vcpkg.bat
          }
          Write-Host "Installing Qt via vcpkg (может занять 30+ мин)..."
          C:\vcpkg\vcpkg install qtbase:x64-windows
          C:\vcpkg\vcpkg install qttools:x64-windows
          echo "C:\vcpkg\installed\x64-windows" >> $env:GITHUB_PATH
          echo "VCPKG_ROOT=C:\vcpkg" >> $env:GITHUB_ENV

      - name: Install CMake and NSIS
        run: |
          choco install cmake --version 3.27.0 -y
          choco install nsis -y

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT\scripts\buildsystems\vcpkg.cmake -DVCPKG_TARGET_TRIPLET=x64-windows

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Create NSIS installer
        shell: pwsh
        run: |
          makensis installer.nsi

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/MatronixLauncher.exe
            MatronixLauncher-Setup.exe
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
