name: Windows Release (EXE Installer)

on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Qt 6 via winget
        shell: pwsh
        run: |
          $ProgressPreference = 'SilentlyContinue'
          try {
            winget install QtProject.Qt.670 --accept-source-agreements --accept-package-agreements --silent
          } catch {
            Write-Host "winget QtProject.Qt.670 failed, trying QtProject.Qt..."
            winget install QtProject.Qt --accept-source-agreements --accept-package-agreements --silent
          }

      - name: Install CMake and NSIS
        run: |
          choco install cmake --version 3.27.0 -y
          choco install nsis -y

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: pwsh
        run: |
          cmake --build build --config Release --parallel $env:NUMBER_OF_PROCESSORS

      - name: Create NSIS installer
        shell: pwsh
        run: |
          makensis installer.nsi

      - name: Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            build/MatronixLauncher.exe
            MatronixLauncher-Setup.exe
          tag_name: ${{ github.ref }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
