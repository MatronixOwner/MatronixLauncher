name: Publish MatronixPrismLauncher preview builds

on:
  workflow_dispatch:
  push:
    branches:
      - "arena/df25a442-matronixlauncher"
    paths:
      - ".release-preview"

permissions: {}

jobs:
  verify_release:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Verify the release tag is new
        shell: bash
        run: |
          set -euo pipefail
          version="$(head -n 1 .release-preview)"
          [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          existing="$(git ls-remote --tags origin "refs/tags/$version")"
          if [[ -n "$existing" ]]; then
            echo "::error::Release tag $version already exists; refusing to replace it."
            exit 1
          fi

  build_release:
    needs: verify_release
    name: Build Windows and Linux packages
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build-type: Release

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release version
        uses: actions/checkout@v6

      - name: Read release version
        shell: bash
        run: echo "VERSION=$(head -n 1 .release-preview)" >> "$GITHUB_ENV"

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          pattern: MatronixPrismLauncher-Windows-MSVC-Setup-*
          path: dist/windows
          merge-multiple: true

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v8
        with:
          pattern: MatronixPrismLauncher-Linux-*-Release-x86_64.AppImage
          path: dist/linux/appimage
          merge-multiple: true

      - name: Download Linux portable artifact
        uses: actions/download-artifact@v8
        with:
          pattern: MatronixPrismLauncher-Linux-Qt6-Portable-*-Release
          path: dist/linux/portable
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          cp dist/windows/MatronixPrismLauncher-Setup.exe .
          cp dist/linux/appimage/MatronixPrismLauncher-Linux-*-Release-x86_64.AppImage \
            MatronixPrismLauncher-Linux-x86_64.AppImage
          cp dist/linux/portable/MatronixPrismLauncher-portable.tar.gz \
            MatronixPrismLauncher-Linux-portable.tar.gz

      - name: Publish public preview release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MatronixPrismLauncher ${{ env.VERSION }}
          body: |
            Предварительная версия MatronixPrismLauncher.

            - Тема Matronix Frost со снежинками и отдельным набором ледяных значков.
            - Локальный видеофон и картинка на фоне с настройками размера, прозрачности и затемнения.
            - Необязательные виджеты часов и общего времени игры; плавные анимации можно отключить.
            - Избранное, поиск и сортировка сборок; управление модами через Modrinth.
            - Для Linux доступны AppImage и переносимый архив; интеграция AppImage использует XDG desktop portals.
            - Установщик Windows не подписан и может вызвать предупреждение SmartScreen.
          draft: false
          prerelease: true
          files: |
            MatronixPrismLauncher-Setup.exe
            MatronixPrismLauncher-Linux-x86_64.AppImage
            MatronixPrismLauncher-Linux-portable.tar.gz
