name: Publish MatronixLauncher preview installer

on:
  push:
    branches:
      - "arena/**"
    paths:
      - ".release-preview"

permissions: {}

jobs:
  build_release:
    name: Build Windows installer
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      packages: write
    with:
      build-type: Release

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release version
        uses: actions/checkout@v6

      - name: Read release version
        shell: bash
        run: echo "VERSION=$(cat .release-preview)" >> "$GITHUB_ENV"

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          pattern: MatronixLauncher-Windows-MSVC-Setup-*
          merge-multiple: true

      - name: Publish public preview release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MatronixLauncher ${{ env.VERSION }}
          body: |
            Preview build of MatronixLauncher.

            - Managed mod discovery and downloads use Modrinth only.
            - The installer is unsigned and may trigger a Windows SmartScreen warning.
            - Ely.by sign-in requires the project's own OAuth Client ID and is not enabled in this preview build.
          draft: false
          prerelease: true
          files: MatronixLauncher-Setup.exe
