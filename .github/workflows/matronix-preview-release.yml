name: Publish MatronixPrismLauncher preview builds

on:
  push:
    branches:
      - "arena/**"
    paths:
      - ".release-preview"

permissions: {}

jobs:
  build_release:
    name: Build Windows and Linux packages
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build-type: Release

  create_release:
    needs: build_release
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release version
        uses: actions/checkout@v6

      - name: Read release version
        shell: bash
        run: echo "VERSION=$(head -n 1 .release-preview)" >> "$GITHUB_ENV"

      - name: Download Windows installer artifact
        uses: actions/download-artifact@v8
        with:
          pattern: MatronixPrismLauncher-Windows-MSVC-Setup-*
          path: dist/windows
          merge-multiple: true

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v8
        with:
          pattern: MatronixPrismLauncher-Linux-*-Release-x86_64.AppImage
          path: dist/linux/appimage
          merge-multiple: true

      - name: Download Linux portable artifact
        uses: actions/download-artifact@v8
        with:
          pattern: MatronixPrismLauncher-Linux-Qt6-Portable-*-Release
          path: dist/linux/portable
          merge-multiple: true

      - name: Prepare release assets
        shell: bash
        run: |
          cp dist/windows/MatronixPrismLauncher-Setup.exe .
          cp dist/linux/appimage/MatronixPrismLauncher-Linux-*-Release-x86_64.AppImage \
            MatronixPrismLauncher-Linux-x86_64.AppImage
          cp dist/linux/portable/MatronixPrismLauncher-portable.tar.gz \
            MatronixPrismLauncher-Linux-portable.tar.gz

      - name: Publish public preview release
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: MatronixPrismLauncher ${{ env.VERSION }}
          body: |
            Preview build of MatronixPrismLauncher.

            - The launcher window title now shows the product name without the development branch suffix.
            - The installer welcome page uses the MatronixPrismLauncher prism logo instead of a cat image.
            - Ely.by OAuth uses the MatronixPrismLauncher Client ID and has clearer configuration errors.
            - Mod discovery and downloads use Modrinth only; the built-in collection now includes seven selectable cats with proper Wikimedia Commons attribution.
            - Appearance settings now support importing personal cat images, adjusting background opacity, and dimming the background for readability.
            - Linux builds are provided as an AppImage and a portable tarball; the AppImage uses XDG desktop portals for desktop integration, including KDE Plasma.
            - The Windows installer is unsigned and may trigger a Windows SmartScreen warning.
          draft: false
          prerelease: true
          files: |
            MatronixPrismLauncher-Setup.exe
            MatronixPrismLauncher-Linux-x86_64.AppImage
            MatronixPrismLauncher-Linux-portable.tar.gz
