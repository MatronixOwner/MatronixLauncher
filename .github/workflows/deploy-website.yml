# Linux AppImage and KDE Plasma desktop integration
name: Deploy MatronixPrismLauncher website

on:
  push:
    branches:
      - main
      - "arena/**"
    paths:
      - "website/**"
      - ".github/workflows/deploy-website.yml"
  workflow_dispatch:
    inputs:
      site_config_json:
        description: Paste the JSON copied from Matronix Studio
        required: true
        type: string

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    if: github.event_name != 'workflow_dispatch' || github.actor == 'MatronixOwner'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Validate and save site settings
        if: github.event_name == 'workflow_dispatch'
        env:
          SITE_CONFIG_JSON: ${{ inputs.site_config_json }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          config = json.loads(os.environ["SITE_CONFIG_JSON"])
          if not isinstance(config, dict):
              raise SystemExit("Site config must be a JSON object")

          version = config.get("releaseVersion", "")
          if not isinstance(version, str) or not re.fullmatch(r"v\d+(?:\.\d+){1,3}(?:-[A-Za-z0-9.-]+)?", version):
              raise SystemExit("Invalid release tag; use a tag such as v0.1.0-alpha.12")
          announcement = config.get("announcement", "")
          if not isinstance(announcement, str) or len(announcement) > 240:
              raise SystemExit("Announcement must be text of at most 240 characters")
          if not isinstance(config.get("announcementEnabled", False), bool):
              raise SystemExit("announcementEnabled must be true or false")

          customization = config.get("customization", {})
          if not isinstance(customization, dict):
              raise SystemExit("customization must be a JSON object")
          if customization.get("theme", "matronix-black") not in {"matronix-black", "matronix-purple", "graphite"}:
              raise SystemExit("Unsupported site theme")
          accent = customization.get("accentColor", "#a9a9ad")
          if not isinstance(accent, str) or not re.fullmatch(r"#[0-9a-fA-F]{6}", accent):
              raise SystemExit("accentColor must be a six-digit hex color")
          for key, limit in (("eyebrow", 80), ("heroCopy", 180), ("ctaLabel", 60)):
              value = customization.get(key, "")
              if not isinstance(value, str) or len(value) > limit:
                  raise SystemExit(f"{key} must be text of at most {limit} characters")
          for key in ("showModrinth", "showFeatures", "showProjects", "showPlatforms"):
              if not isinstance(customization.get(key, True), bool):
                  raise SystemExit(f"{key} must be true or false")

          config_path = Path("website/site-config.json")
          config_path.write_text(json.dumps(config, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"release_version={version}\n")
          PY

      - name: Verify published release has a Windows installer
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          SITE_CONFIG_JSON: ${{ inputs.site_config_json }}
        run: |
          RELEASE_VERSION="$(python3 -c 'import json,os; print(json.loads(os.environ["SITE_CONFIG_JSON"])["releaseVersion"])')"
          gh release view "$RELEASE_VERSION" --repo "$GITHUB_REPOSITORY" --json assets \
            --jq '.assets[].name' | grep -Fx 'MatronixPrismLauncher-Setup.exe'

      - name: Commit settings to the selected branch
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_REF_NAME: ${{ github.ref_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/site-config.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(website): publish settings from Matronix Studio"
            git push origin "HEAD:${GH_REF_NAME}"
          fi

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload static site
        uses: actions/upload-pages-artifact@v3
        with:
          path: website

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
