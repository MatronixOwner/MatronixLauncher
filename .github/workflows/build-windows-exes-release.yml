name: Build Windows release executables without publishing

on:
  push:
    branches:
      - "arena/**"
    paths:
      - "launcher/CMakeLists.txt"
      - "launcher/devpreview/**"
      - "launcher/resources/seasonal/**"
      - "launcher/ui/**"
      - "website/winter-lab.*"
      - ".github/workflows/build.yml"
      - ".github/workflows/build-windows-exes-release.yml"

permissions: {}

jobs:
  release-build:
    name: Build release packages and preview executable
    uses: ./.github/workflows/build.yml
    permissions:
      contents: read
      id-token: write
      packages: write
    with:
      build-type: Release
